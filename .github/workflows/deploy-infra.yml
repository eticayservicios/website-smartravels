name: Deploy infrastructure

# S3 + CloudFront alias smartravelevents.smartravelevents.com
# Requires GitHub secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Optional secrets: CERTIFICATE_ARN, HOSTED_ZONE_ID. If missing, the job looks them up.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - prod
    paths:
      - 'templates/**'
      - 'samconfig.toml'
      - '.github/workflows/deploy-infra.yml'

env:
  AWS_REGION: us-east-1
  STACK_NAME: website-smartravels-prod
  TEMPLATE_FILE: templates/template.yaml
  SITE_DOMAIN: smartravelevents.smartravelevents.com
  HOSTED_ZONE_NAME: smartravelevents.com

jobs:
  deploy:
    name: SAM deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::Falta el secret AWS_ACCESS_KEY_ID en GitHub (Settings → Secrets and variables → Actions → Secrets)."
            missing=1
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Falta el secret AWS_SECRET_ACCESS_KEY en GitHub."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ACM certificate
        id: cert
        env:
          CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
        run: |
          if [ -n "$CERTIFICATE_ARN" ]; then
            echo "Usando secret CERTIFICATE_ARN"
            echo "arn=${CERTIFICATE_ARN}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          found=""
          arns=$(aws acm list-certificates \
            --region "${AWS_REGION}" \
            --certificate-statuses ISSUED \
            --query 'CertificateSummaryList[].CertificateArn' \
            --output text)

          for arn in $arns; do
            [ -z "$arn" ] && continue
            names=$(aws acm describe-certificate \
              --region "${AWS_REGION}" \
              --certificate-arn "$arn" \
              --query 'Certificate.SubjectAlternativeNames[]' \
              --output text)
            if echo "$names" | tr '\t' '\n' | grep -qx "${SITE_DOMAIN}"; then
              found="$arn"
              break
            fi
            if echo "$names" | tr '\t' '\n' | grep -qx "*.smartravelevents.com"; then
              found="$arn"
              break
            fi
          done

          if [ -n "$found" ]; then
            echo "Certificado existente: $found"
            echo "arn=${found}" >> "$GITHUB_OUTPUT"
          else
            echo "No hay certificado ISSUED. El stack creará uno para ${SITE_DOMAIN} y www.${SITE_DOMAIN}."
            echo "arn=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Route 53 hosted zone
        id: zone
        env:
          HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
        run: |
          if [ -n "$HOSTED_ZONE_ID" ]; then
            echo "Usando secret HOSTED_ZONE_ID"
            echo "id=${HOSTED_ZONE_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zone_id=$(aws route53 list-hosted-zones-by-name \
            --dns-name "${HOSTED_ZONE_NAME}" \
            --query "HostedZones[?Name=='${HOSTED_ZONE_NAME}.'].Id | [0]" \
            --output text)

          zone_id="${zone_id#/hostedzone/}"

          if [ -z "$zone_id" ] || [ "$zone_id" = "None" ] || [ "$zone_id" = "null" ]; then
            echo "::error::No hay hosted zone de Route 53 para ${HOSTED_ZONE_NAME} en esta cuenta. Créala o añade el secret HOSTED_ZONE_ID."
            exit 1
          fi

          echo "Hosted zone encontrada: $zone_id"
          echo "id=${zone_id}" >> "$GITHUB_OUTPUT"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate template
        run: sam validate --lint -t ${{ env.TEMPLATE_FILE }} --region ${{ env.AWS_REGION }}

      - name: Deploy stack
        env:
          CERT_ARN: ${{ steps.cert.outputs.arn }}
          ZONE_ID: ${{ steps.zone.outputs.id }}
        run: |
          PARAM_OVERRIDES=(
            "ProjectName=website-smartravels"
            "SiteName=smartravels"
            "Environment=prod"
            "BucketName=smartravelevents-com-prod"
            "DomainName=${SITE_DOMAIN}"
            "WwwDomainName=www.${SITE_DOMAIN}"
            "HostedZoneId=${ZONE_ID}"
            "PriceClass=PriceClass_100"
          )

          if [ -n "$CERT_ARN" ]; then
            PARAM_OVERRIDES+=("CertificateArn=${CERT_ARN}")
          fi

          sam deploy \
            --template-file "${TEMPLATE_FILE}" \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides "${PARAM_OVERRIDES[@]}"

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Stacks[0].Outputs' \
            --output table
          echo "Route 53 alias: ${SITE_DOMAIN} y www.${SITE_DOMAIN} → CloudFront (hosted zone ${{ steps.zone.outputs.id }})"
